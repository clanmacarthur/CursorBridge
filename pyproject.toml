[build-system]
requires = ["hatchling>=1.12.0"]
build-backend = "hatchling.build"

[project]
name = "cursorbridge"
version = "0.1.0"
description = "CLI to bridge Excel (VBA-less), Power Automate Desktop, and Notion"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "CursorBridge" }]
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "xlwings>=0.30",
]

[project.scripts]
cb = "cb.cli:main"
